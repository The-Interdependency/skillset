name: repair-derived-authority

on:
  push:
    branches: [repair/authority-and-ai-launcher]
    paths: [.github/workflows/repair-derived-authority.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: repair/authority-and-ai-launcher
      - name: Repair derived authority prose
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changes = {
              "README.md": [
                  (
                      "| [`gonol-build/`](gonol-build/SKILL.md) | UCNS geometry / EDCM text construction, closure, atomic participation at admissible scales, and scoped replay discipline. Resolves each owning contract; preserves exact source and occurrence identity; imposes no universal scale ladder. Independent of msdmd. |",
                      "| [`gonol-build/`](gonol-build/SKILL.md) | UCNS gonol objects/constructors/geometry + Stack language-construction research discipline. Preserves closure, atomic participation, exact source/occurrence identity, provenance, honest `hmmm`, and scoped replay; EDCM is measurement/evaluation only. Independent of msdmd. |",
                  ),
                  (
                      "## Maintenance tools\n\nPure-stdlib helper scripts live in [`tools/`](tools/README.md). The small\n`llms/` package exists only to provide the `python -m llms.build` command.\n",
                      "## VM coding-agent launcher\n\nThe canonical `ai` tmux launcher lives at `tools/ai.sh`. Install a stable command in the user PATH without copying the implementation:\n\n```bash\nbash tools/install_ai.sh\n```\n\nThe installer creates `~/.local/bin/ai` pointing back to this checkout. `ai status` reports actual pane state, `ai restart deepcode` recreates/restarts DeepCode, and pane output persists under `~/.local/state/a0/logs`. Provider credentials remain owned by the provider CLIs/environment.\n\n## Maintenance tools\n\nPure-stdlib helper scripts live in [`tools/`](tools/README.md). The small\n`llms/` package exists only to provide the `python -m llms.build` command.\n",
                  ),
              ],
              "CLAUDE.md": [
                  (
                      "| `gonol-build/` | procedural | — | UCNS geometry / EDCM text construction discipline. Resolve current owning contracts and admissible scale options; preserve closure, atomic participation, occurrence identity, full-source receipts, and protocol-required replay. Refuses superseded omega/phi/psi, bone/flesh, and carrier-LCM language doctrine. |",
                      "| `gonol-build/` | procedural | — | UCNS gonol objects/constructors/geometry + Stack language-construction research discipline. Resolve the owning Stack workspace, preserve closure, atomic participation, occurrence identity, constitutive relations, provenance, and required replay; EDCM is measurement/evaluation only. |",
                  ),
                  (
                      "- Validation here is editorial plus pure-stdlib helper scripts in `tools/`, `ratios/`, `llms/`, and the RepoLOTO check module.\n",
                      "- Validation here is editorial plus pure-stdlib helper scripts in `tools/`, `ratios/`, `llms/`, and the RepoLOTO check module.\n- `tools/ai.sh` is the canonical VM coding-agent tmux launcher; `tools/install_ai.sh` installs the stable `~/.local/bin/ai` PATH wrapper.\n",
                  ),
              ],
          }

          for filename, replacements in changes.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"expected text missing in {filename}: {old[:80]!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit derived repair
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "skill-lib repair"
          git config user.email "actions@users.noreply.github.com"
          git add README.md CLAUDE.md
          git commit -m "docs: repair derived gonol authority and ai launcher [skip ci]"
          git push origin HEAD:repair/authority-and-ai-launcher
