name: repair-ai-docs

on:
  push:
    branches: [repair/authority-and-ai-launcher]
    paths: [.github/workflows/repair-ai-docs.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: repair/authority-and-ai-launcher
      - name: Repair ai launcher documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "README.md": [
                  (
                      "The canonical `ai` tmux launcher lives at `tools/ai.sh`. Install a stable command in the user PATH without copying the implementation:",
                      "The canonical `ai.sh` launcher lives at `tools/ai.sh`. It runs on Termux, reaches the `a0` VM through the SSH host alias `a0`, and manages the remote `a0` tmux session. Install it into the caller's PATH without copying the implementation:",
                  ),
                  (
                      "The installer creates `~/.local/bin/ai` pointing back to this checkout. `ai status` reports actual pane state, `ai restart deepcode` recreates/restarts DeepCode, and pane output persists under `~/.local/state/a0/logs`. Provider credentials remain owned by the provider CLIs/environment.",
                      "On Termux the installer symlinks `ai.sh` into `$PREFIX/bin`; elsewhere it falls back to `~/.local/bin/ai.sh`. `ai.sh status` reports remote pane state, `ai.sh restart deepcode` repairs a missing/dead DeepCode window, and pane output persists on the VM under `~/.local/state/a0/logs`. `ai.sh keys` only propagates already-present VM login-environment keys into tmux and reports presence/missing, never values.",
                  ),
              ],
              "CLAUDE.md": [
                  (
                      "- `tools/ai.sh` is the canonical VM coding-agent tmux launcher; `tools/install_ai.sh` installs the stable `~/.local/bin/ai` PATH wrapper.",
                      "- `tools/ai.sh` is the canonical Termux-side SSH/tmux launcher for the `a0` VM; `tools/install_ai.sh` installs `ai.sh` into the caller's PATH (Termux `$PREFIX/bin`, otherwise `~/.local/bin`).",
                  ),
              ],
              "AGENTS.md": [
                  (
                      "tools/ai.sh                    # canonical VM coding-agent tmux launcher\ntools/install_ai.sh            # installs ~/.local/bin/ai PATH wrapper",
                      "tools/ai.sh                    # canonical Termux -> a0 SSH/tmux coding-agent launcher\ntools/install_ai.sh            # installs ai.sh into caller PATH (Termux $PREFIX/bin first)",
                  ),
                  (
                      "- `tools/ai.sh` — canonical VM coding-agent launcher.\n- `tools/install_ai.sh` — PATH installer for `~/.local/bin/ai`.",
                      "- `tools/ai.sh` — canonical Termux-side launcher for the remote a0 tmux coding-agent session.\n- `tools/install_ai.sh` — installs `ai.sh` into caller PATH, preferring Termux `$PREFIX/bin`.",
                  ),
              ],
              "tools/README.md": [
                  ("## Canonical `ai` launcher", "## Canonical `ai.sh` launcher"),
                  (
                      "`tools/ai.sh` is the canonical VM coding-agent launcher. It owns the `a0` tmux\nsession layout, real pane/process status, restart, `remain-on-exit`, and\npersistent pane logs under `~/.local/state/a0/logs`.",
                      "`tools/ai.sh` is the canonical Termux-side launcher for the coding-agent CLIs on the `a0` VM. It uses the SSH host alias `a0` and owns the remote tmux session layout (`0:shell`, `1:grok`, `2:codex`, `3:deepcode`), real pane/process status, restart, `remain-on-exit`, and persistent VM logs under `~/.local/state/a0/logs`.",
                  ),
                  ("Install the stable `ai` command into the user PATH:", "Install the stable `ai.sh` command into the caller PATH:"),
                  (
                      "The installer creates `~/.local/bin/ai` as a wrapper pointing back to the\ncanonical `tools/ai.sh`; it does not copy a second implementation. If\n`~/.local/bin` is absent from PATH it adds one idempotent login-shell line to\n`~/.profile`.",
                      "On Termux the installer symlinks the canonical source to `$PREFIX/bin/ai.sh`, which is already on PATH. Elsewhere it uses `~/.local/bin/ai.sh` and adds one idempotent login-shell PATH line only when required. No second launcher implementation is copied.",
                  ),
                  ("ai\nai status\nai restart deepcode\nai logs deepcode\nai codex", "ai.sh\nai.sh status\nai.sh restart deepcode\nai.sh logs deepcode\nai.sh codex"),
                  (
                      "Provider credentials remain the responsibility of the installed provider CLIs\nand VM environment. The launcher does not read, print, or become a key vault.",
                      "Provider credentials remain the responsibility of the VM/provider CLIs. `ai.sh keys` only copies already-present VM login-environment values into the remote tmux environment so restarted CLIs can see them; it prints only `present`/`missing` and never stores or displays key values.",
                  ),
              ],
              "skill-lib_msdmd.ts": [
                  (
                      'summary: "Canonical tmux launcher for coding-agent CLIs with pane health, restart, remain-on-exit, and persistent logs",',
                      'summary: "Canonical Termux-side SSH/tmux launcher for a0 VM coding-agent CLIs with pane health, restart, key propagation, remain-on-exit, and persistent remote logs",',
                  ),
                  (
                      'summary: "Installs the skill-lib ai launcher as ~/.local/bin/ai and ensures the user PATH contains ~/.local/bin",',
                      'summary: "Installs canonical ai.sh into caller PATH, preferring Termux $PREFIX/bin and otherwise ~/.local/bin",',
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"expected text missing in {filename}: {old[:100]!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit docs repair
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "skill-lib repair"
          git config user.email "actions@users.noreply.github.com"
          git add README.md CLAUDE.md AGENTS.md tools/README.md skill-lib_msdmd.ts
          git commit -m "docs: align ai.sh with Termux-to-VM launcher [skip ci]"
          git push origin HEAD:repair/authority-and-ai-launcher
